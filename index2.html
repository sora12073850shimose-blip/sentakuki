<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洗濯機利用登録</title>
  <!-- LIFF SDKの読み込み -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f5f5f5;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    .status {
      font-weight: bold;
      color: #06C755; /* LINEグリーン */
      margin-bottom: 15px;
    }
    .user-id-box {
      background: #eee;
      padding: 10px;
      border-radius: 5px;
      word-break: break-all;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>洗濯機 通知登録</h2>
    <p id="status" class="status">LIFFを初期化中...</p>
    
    <div>
      <p>あなたのLINE User ID:</p>
      <div id="userIdDisplay" class="user-id-box">取得待機中...</div>
    </div>
  </div>

  <script>
    // ★ここにLINE Developersで発行した自分のLIFF IDを入れてください
    const MY_LIFF_ID = "2012570669-ilYwaKU1";

    // ページ読み込み時に実行
    window.onload = function() {
      initializeLiff(MY_LIFF_ID);
    };

    async function initializeLiff(liffId) {
      const statusEl = document.getElementById('status');
      const userIdEl = document.getElementById('userIdDisplay');

      try {
        // 1. LIFFの初期化
        await liff.init({ liffId: liffId });

        // 2. ログイン状態の確認
        if (!liff.isLoggedIn()) {
          statusEl.innerText = "LINEにログインします...";
          // 未ログインならLINEログイン画面へリダイレクト（外部ブラウザ対策）
          liff.login();
          return;
        }

        // 3. プロフィール情報の取得（ここで「U...」のUser IDが取れる）
        statusEl.innerText = "ユーザー情報を取得中...";
        const profile = await liff.getProfile();
        const userId = profile.userId;

        // 4. 画面に表示
        statusEl.innerText = "ログイン完了！";
        userIdEl.innerText = userId;

        // コンソールにも出力（デバッグ用）
        console.log("取得したUser ID:", userId);
        console.log("表示名:", profile.displayName);

      } catch (error) {
        statusEl.style.color = "red";
        statusEl.innerText = "エラーが発生しました";
        userIdEl.innerText = error.message;
        console.error("LIFF Error:", error);
      }
    }
  </script>

</body>
</html>
